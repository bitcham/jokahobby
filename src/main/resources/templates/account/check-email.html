<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments.html :: head}"></head>
<body class="bg-light">
    <nav th:replace="~{fragments.html :: main-nav}"></nav>

    <div class="container">
        <div class="py-5 text-center" th:if="${error != null}">
            <p class="lead">Sign up for JokaHobby</p>
            <div  class="alert alert-danger" role="alert" th:text="${error}"></div>
            <p class="lead" th:text="${email}">your@email.com</p>
        </div>

        <div class="py-5 text-center" th:if="${error == null}">
            <p class="lead">Sign up for JokaHobby</p>

            <h2>Check your verification email to use the JokaHobby service.</h2>

            <div>
                <p class="lead" th:text="${email}">your@email.com</p>
                <a class="btn btn-outline-info" th:href="@{/resend-confirm-email}">Resend verification email</a>
            </div>
        </div>
    </div>
</body>
</html>
