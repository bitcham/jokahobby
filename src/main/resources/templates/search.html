<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments.html :: head}"></head>
<body class="bg-light">
    <div th:replace="~{fragments.html :: main-nav}"></div>
    <div class="container">
        <div class="py-5 text-center">
            <p class="lead" th:if="${hobbyPage.getTotalElements() == 0}">
                No hobbies found matching <strong th:text="${keyword}" id="keyword" class="context"></strong>.
            </p>
            <p class="lead" th:if="${hobbyPage.getTotalElements() > 0}">
                <span th:text="${hobbyPage.getTotalElements()}"></span> hobbies matching
                <strong th:text="${keyword}" id="keyword" class="context"></strong> found.
            </p>
            <div class="dropdown">
                <button class="btn btn-light dropdown-toggle" type="button" id="dropdownMenuButton" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                    Sort search results by
                </button>
                <div class="dropdown-menu" aria-labelledby="dropdownMenuButton">
                    <a class="dropdown-item" th:classappend="${#strings.equals(sortProperty, 'publishedDateTime')}? active"
                       th:href="@{'/search/hobby?sort=publishedDateTime,desc&keyword=' + ${keyword}}">
                        Hobby publication date
                    </a>
                    <a class="dropdown-item" th:classappend="${#strings.equals(sortProperty, 'memberCount')}? active"
                       th:href="@{'/search/hobby?sort=memberCount,desc&keyword=' + ${keyword}}">
                        Number of members
                    </a>
                </div>
            </div>
        </div>
        <div class="row justify-content-center">
            <div class="col-sm-10">
                <div class="row">
                    <div class="col-md-4" th:each="hobby: ${hobbyPage.getContent()}">
                        <div class="card mb-4 shadow-sm">
                            <img th:src="${hobby.image}" class="context card-img-top" th:alt="${hobby.title}" >
                            <div class="card-body">
                                <a th:href="@{'/hobby/' + ${hobby.path}}" class="text-decoration-none">
                                    <h5 class="card-title context" th:text="${hobby.title}"></h5>
                                </a>
                                <p class="card-text" th:text="${hobby.shortDescription}">Short description</p>
                                <p class="card-text context">
                                    <span th:each="tag: ${hobby.tags}" class="font-weight-light text-monospace badge badge-pill badge-info mr-3">
                                        <a  class="text-decoration-none text-white">
                                            <i class="fa fa-tag"></i> <span th:text="${tag.title}">Tag</span>
                                        </a>
                                    </span>
                                    <span th:each="zone: ${hobby.zones}" class="font-weight-light text-monospace badge badge-primary mr-3">
                                        <a class="text-decoration-none text-white">
                                            <i class="fa fa-globe"></i><span th:text="${zone.localNameOfCity != 'none' ? zone.localNameOfCity : zone.city}" class="text-white">City</span>
                                        </a>
                                    </span>
                                </p>
                                <div class="d-flex justify-content-between align-items-center">
                                    <small class="text-muted">
                                        <i class="fa fa-user-circle"></i>
                                        <span th:text="${hobby.members.size() + hobby.managers.size()}"></span> members
                                    </small>
                                    <small class="text-muted date" th:text="${hobby.publishedDateTime}">9 mins</small>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row justify-content-center">
            <div th:replace="~{fragments.html :: hobby-list (hobbyList=${hobbyPage.getContent()})}"></div>
        </div>
    </div>
    <div th:replace="~{fragments.html :: footer}"></div>
    <script th:replace="~{fragments.html :: date-time}"></script>
    <script src="/node_modules/mark.js/dist/jquery.mark.min.js"></script>
    <script type="application/javascript">
        $(function(){
            var mark = function() {
                // Read the keyword
                var keyword = $("#keyword").text();

                // Determine selected options
                var options = {
                    "each": function(element) {
                        setTimeout(function() {
                            $(element).addClass("animate");
                        }, 150);
                    }
                };

                // Mark the keyword inside the context
                $(".context").unmark({
                    done: function() {
                        $(".context").mark(keyword, options);
                    }
                });
            };

            mark();
        });
    </script>
</body>
</html>
