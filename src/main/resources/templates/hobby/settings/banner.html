<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments.html :: head"></head>
<body>
<nav th:replace="fragments.html :: main-nav"></nav>
<div th:replace="fragments.html :: hobby-banner"></div>
<div class="container">
    <div th:replace="fragments.html :: hobby-info"></div>
    <div th:replace="fragments.html :: hobby-menu(hobbyMenu='settings')"></div>
    <div class="row mt-3 justify-content-center">
        <div class="col-2">
            <div th:replace="fragments.html :: hobby-settings-menu(currentMenu='image')"></div>
        </div>
            <div class="col-8">
                <div th:replace="fragments.html :: message"></div>
                <div class="row">
                    <h2 class="col-sm-12">Use Banner Image</h2>
                </div>
                <form th:if="${!hobby.useBanner}" action="#" th:action="@{'/hobby/' + ${hobby.getPath()} + '/settings/banner/enable'}" method="post" novalidate>
                    <div class="alert alert-primary" role="alert">
                        Use a banner image in the hobby menu. If you haven't set a hobby banner image yet, the default banner image will be used.
                    </div>
                    <div class="form-group">
                        <button class="btn btn-outline-primary btn-block" type="submit" aria-describedby="submitHelp">Use Banner Image</button>
                    </div>
                </form>
                <form th:if="${hobby.useBanner}" action="#" th:action="@{'/hobby/' + ${hobby.getPath()} + '/settings/banner/disable'}" method="post" novalidate>
                    <div class="alert alert-info" role="alert">
                        Do not use the hobby banner image in the hobby menu. The banner image will still be used in the hobby list.
                    </div>
                    <div class="form-group">
                        <button class="btn btn-outline-primary btn-block" type="submit" aria-describedby="submitHelp">Don't Use Banner Image</button>
                    </div>
                </form>
                <hr/>
                <div class="row">
                    <h2 class="col-sm-12">Change Banner Image</h2>
                </div>
                <form id="imageForm" action="#" th:action="@{'/hobby/' + ${hobby.getPath()} + '/settings/banner'}" method="post" novalidate>
                    <div class="form-group">
                        <input id="hobbyImage" type="hidden" name="image" class="form-control" />
                    </div>
                </form>
                <div class="card text-center">
                    <div id="current-hobby-image" class="mt-3">
                        <img class="rounded" th:src="${hobby.image}" width="640" alt="name" th:alt="${hobby.title}"/>
                    </div>
                    <div id="new-hobby-image" class="mt-3"></div>
                    <div class="card-body">
                        <div class="custom-file">
                            <input type="file" class="custom-file-input" id="hobby-image-file">
                            <label class="custom-file-label" for="hobby-image-file">Change hobby Image</label>
                        </div>
                        <div id="new-hobby-image-control" class="mt-3">
                            <button class="btn btn-outline-primary btn-block" id="cut-button">Crop</button>
                            <button class="btn btn-outline-success btn-block" id="confirm-button">Confirm</button>
                            <button class="btn btn-primary btn-block" id="save-button">Save</button>
                            <button class="btn btn-outline-warning btn-block" id="reset-button">Cancel</button>
                        </div>
                        <div id="cropped-new-hobby-image" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
        <div th:replace="fragments.html :: footer"></div>
    </div>
    <script th:replace="fragments.html :: tooltip"></script>
    <link  href="/node_modules/cropper/dist/cropper.min.css" rel="stylesheet">
    <script src="/node_modules/cropper/dist/cropper.min.js"></script>
    <script src="/node_modules/jquery-cropper/dist/jquery-cropper.min.js"></script>
    <script type="application/javascript">
        $(function() {
            cropper = '';
            let $confirmBtn = $("#confirm-button");
            let $resetBtn = $("#reset-button");
            let $cutBtn = $("#cut-button");
            let $saveBtn = $("#save-button");
            let $newhobbyImage = $("#new-hobby-image");
            let $currenthobbyImage = $("#current-hobby-image");
            let $resultImage = $("#cropped-new-hobby-image");
            let $hobbyImage = $("#hobbyImage");

            $newhobbyImage.hide();
            $cutBtn.hide();
            $resetBtn.hide();
            $confirmBtn.hide();
            $saveBtn.hide();

            $("#hobby-image-file").change(function(e) {
                if (e.target.files.length === 1) {
                    const reader = new FileReader();
                    reader.onload = e => {
                        if (e.target.result) {
                            if (!e.target.result.startsWith("data:image")) {
                                alert("Please select an image file.");
                                return;
                            }

                            let img = document.createElement("img");
                            img.id = 'new-hobby';
                            img.src = e.target.result;
                            img.setAttribute('width', '100%');

                            $newhobbyImage.html(img);
                            $newhobbyImage.show();
                            $currenthobbyImage.hide();

                            let $newImage = $(img);
                            $newImage.cropper({aspectRatio: 13/2});
                            cropper = $newImage.data('cropper');

                            $cutBtn.show();
                            $confirmBtn.hide();
                            $resetBtn.show();
                        }
                    };

                    reader.readAsDataURL(e.target.files[0]);
                }
            });

            $resetBtn.click(function() {
                $currenthobbyImage.show();
                $newhobbyImage.hide();
                $resultImage.hide();
                $resetBtn.hide();
                $cutBtn.hide();
                $confirmBtn.hide();
                $saveBtn.hide();
                $hobbyImage.val('');
            });

            $cutBtn.click(function () {
                let dataUrl = cropper.getCroppedCanvas().toDataURL();

                if (dataUrl.length > 1000 * 1024) {
                    alert("The image file is too large. Please use a file smaller than 1024000. Current image size: " + dataUrl.length);
                    return;
                }

                let newImage = document.createElement("img");
                newImage.id = "cropped-new-hobby-image";
                newImage.src = dataUrl;
                newImage.width = 640;
                $resultImage.html(newImage);
                $resultImage.show();
                $confirmBtn.show();

                $confirmBtn.click(function () {
                    $newhobbyImage.html(newImage);
                    $cutBtn.hide();
                    $confirmBtn.hide();
                    $hobbyImage.val(dataUrl);
                    $saveBtn.show();
                });
            });

            $saveBtn.click(function() {
                $("#imageForm").submit();
            })
        });
    </script>
</body>
</html>
