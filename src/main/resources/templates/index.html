<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments.html :: head}"></head>
<body class="bg-light">
    <div th:replace="~{fragments.html :: main-nav}"></div>
    <section class="jumbotron text-center">
        <div class="container">
            <h1>JokaHobby</h1>
            <p class="lead text-muted">
                Find and join hobby groups based on tags and regions.<br/>
                We provide hobby group management features.
            </p>
            <p>
                <a th:href="@{/sign-up}" class="btn btn-primary my-2">Sign Up</a>
            </p>
        </div>
    </section>
    <div class="container">
        <div class="row justify-content-center pt-3">
            <div th:replace="~{fragments.html :: hobby-list (hobbyList=${hobbyList})}"></div>
        </div>
    </div>
    <div th:replace="~{fragments.html :: footer}"></div>
    <div th:replace="~{fragments.html :: date-time}"></div>
</body>
</html>
