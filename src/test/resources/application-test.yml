spring:
  jpa:
    hibernate:
      ddl-auto: update
  datasource:
    url: jdbc:tc:postgresql:17-alpine:///hobbytest
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
        provider:
          google:
            authorization-uri: http://localhost:8089/o/oauth2/auth
            token-uri: http://localhost:8089/oauth2/token
            user-info-uri: http://localhost:8089/oauth2/userinfo
            jwk-set-uri: http://localhost:8089/oauth2/certs
  cloud:
    aws:
      region:
        static: ap-northeast-2
      credentials:
        access-key: test
        secret-key: test
      s3:
        endpoint: http://localhost:4566

jwt:
  secret: dGVzdC1zZWNyZXQta2V5LXRoYXQtaXMtbG9uZy1lbm91Z2gtZm9yLWhtYWMtc2hhMjU2LWFsZ29yaXRobQ==
  access-token-expiry: 1800000
  refresh-token-expiry: 604800000
  max-sessions: 5
  secure-cookie: false

app:
  frontend-url: http://localhost:5173
